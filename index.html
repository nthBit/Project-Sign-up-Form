<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Document</title>
</head>
<body>
    <div class="main-container">
        <div class="background-image">
            <img id="plant-img" src="./plant-background.avif">
        </div>
        <div class="form-container">
            <div class="intro-text">
                <p>
                    This is not a real online service! You know you need something like this in 
                    your life to help you realize your deepest dreams. Sign up now to get started.
                </p>
                <p>You know you want to.</p>
            </div>
            <div>
                <form class="form" action="example.com" method="post">
                    <p>Let's do this!</p>
                    <table>
                        <tr>
                            <td>
                                <label for="first-name">First Name:</label>
                                <input type="text" id="first-name" name="first-name">
                            </td>
                            <td>
                                <label for="last-name">Last Name:</label>
                                <input type="text" id="last-name" name="last-name">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="user-email">Email:</label>
                                <input type="email" id="user-email" name="user-email">
                            </td>
                            <td>
                                <label for="phone-number">Phone Number:</label>
                                <input type="number" id="phone-number" name="phone-number">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="user-password">Password</label>
                                <input type="password" id="user-password" name="user-password">
                            </td>
                            <td>
                                <label for="pw-confirmation">Confirm Password</label>
                                <input type="password" id="pw-confirmation" name="pw-confirmation">
                            </td>
                        </tr>
                    </form>
                </table>
            </div>
            <hr>
            <div class="create-account">
                <button type="button">Create Account</button>
                <p>Already have an account? <a href="example.com">Log in</a></p>
            </div>
        </div>
    </div>










</body>
</html>
